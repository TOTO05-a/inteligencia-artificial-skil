<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini chat</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script> 
</head>
<body>
    <header class="app-header">
        <div class="brand">
            <img class="brand-logo" src="./assets/campuslands-banner.png" alt="Campuslands" onerror="this.style.display='none'">
        </div>
            <div class="settings">
            <select name="modelSelect" id="modelSelect" title="Modelo">
                <option value="gemini-2.5-flash">gemini-2.5-flash</option>
                <option value="gemini-1.5-pro">gemini-1.5-pro</option>

            </select>
            <button id="clearChatBtn" class="button.ghost" title="Borrar conversacion">Borrar</button>
        </div>
    </header>
    <main class="chat">
        <div id="messages" class="messages" aria-live="polite"> </div>
        <form id="composer" class="composer" autocomplete="off">
            <textarea name="prompt" id="prompt" rows="1" required placeholder="Escribe tu mensaje y dale enter..."></textarea>
            <div class="composer-actions">
                <button id="sendBtn" type="submit">Enviar</button>
            </div>
        </form>
    </main>
    <script src="config.js"></script>
<script src="script.js"></script>
</body>
</html>
